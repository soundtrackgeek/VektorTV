name: Verify
on: [push, pull_request]
jobs:
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-tvos-sim
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p vektortv-core -p vektortv-apple
      - run: cargo clippy -p vektortv-core -p vektortv-apple --all-targets -- -D warnings
      - run: xcodebuild -project apps/apple/VektorTV.xcodeproj -scheme VektorTV-iOS -destination 'generic/platform=iOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - run: xcodebuild -project apps/apple/VektorTV.xcodeproj -scheme VektorTV-tvOS -destination 'generic/platform=tvOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
