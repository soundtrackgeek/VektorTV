name: Verify
on: [push, pull_request]
jobs:
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-ios-sim,aarch64-apple-tvos-sim
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p vektortv-core -p vektortv-apple
      - run: cargo clippy -p vektortv-core -p vektortv-apple --all-targets -- -D warnings
      - uses: actions/cache@v4
        with:
          path: apps/apple/.derivedData/SourcePackages
          key: apple-spm-${{ hashFiles('apps/apple/VektorTV.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - run: xcodebuild -project apps/apple/VektorTV.xcodeproj -scheme VektorTV-iOS -destination 'generic/platform=iOS Simulator' -derivedDataPath apps/apple/.derivedData/ci -clonedSourcePackagesDirPath apps/apple/.derivedData/SourcePackages -onlyUsePackageVersionsFromResolvedFile ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - run: python3 apps/apple/scripts/check-playback-linkage.py apps/apple/.derivedData/ci/Build/Products/Debug-iphonesimulator/VektorTV-iOS.app
      - run: xcodebuild -project apps/apple/VektorTV.xcodeproj -scheme VektorTV-tvOS -destination 'generic/platform=tvOS Simulator' -derivedDataPath apps/apple/.derivedData/ci -clonedSourcePackagesDirPath apps/apple/.derivedData/SourcePackages -onlyUsePackageVersionsFromResolvedFile ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - run: python3 apps/apple/scripts/check-playback-linkage.py apps/apple/.derivedData/ci/Build/Products/Debug-appletvsimulator/VektorTV-tvOS.app
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: npm run build
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Prepare VLC and build Windows installer
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:ProgramFiles\VideoLAN\VLC\libvlc.dll")) {
            choco install vlc --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          npm run bundle:windows
      - uses: actions/upload-artifact@v4
        with:
          name: VektorTV-Windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm test
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Prepare VLC and build macOS disk image
        run: |
          brew install --cask vlc
          npm run bundle:mac
      - uses: actions/upload-artifact@v4
        with:
          name: VektorTV-macOS
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
